<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exhibition Catalogue - Gallery Ledger</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav id="nav"></nav>
  </header>

  <main>
    <div id="not-found" hidden>
      <h1>Exhibition not found</h1>
      <p>The requested exhibition does not exist.</p>
      <p><a href="exhibitions.html">&larr; Back to exhibitions</a></p>
    </div>

    <div id="empty-state" hidden>
      <h1 id="empty-title">Exhibition Catalogue</h1>
      <p>No works placed yet.</p>
      <p><a href="#" id="empty-place-link">&larr; Place artworks</a></p>
    </div>

    <div id="catalogue-view" hidden>
      <p class="no-print">
        <a href="#" id="back-link">&larr; Back to exhibition</a> · 
        <button type="button" id="print-btn">Print</button>
      </p>

      <h1 id="cat-title"></h1>
      <p class="label-meta" id="cat-meta"></p>
      <p id="cat-desc"></p>

      <hr>

      <div id="cat-spaces"></div>

      <hr>

      <p class="label-meta" id="cat-summary"></p>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/catalogue.js"></script>
</body>
</html>

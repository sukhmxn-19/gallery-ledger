<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bfCelluloid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#202126"/>
    </linearGradient>
  </defs>
  <!-- Archival Presentation Ground -->
  <rect width="400" height="300" fill="#202124"/>
  <rect x="15" y="15" width="370" height="270" fill="url(#bfCelluloid)" stroke="#3f424a" stroke-width="1"/>
  
  <!-- 35mm Celluloid Sprocket Holes along Top Edge -->
  <g fill="#0b0b0c">
    <rect x="35" y="28" width="16" height="22" rx="3"/>
    <rect x="75" y="28" width="16" height="22" rx="3"/>
    <rect x="115" y="28" width="16" height="22" rx="3"/>
    <rect x="155" y="28" width="16" height="22" rx="3"/>
    <rect x="195" y="28" width="16" height="22" rx="3"/>
    <rect x="235" y="28" width="16" height="22" rx="3"/>
    <rect x="275" y="28" width="16" height="22" rx="3"/>
    <rect x="315" y="28" width="16" height="22" rx="3"/>
    <rect x="355" y="28" width="16" height="22" rx="3"/>
  </g>
  
  <!-- 35mm Celluloid Sprocket Holes along Bottom Edge -->
  <g fill="#0b0b0c">
    <rect x="35" y="238" width="16" height="22" rx="3"/>
    <rect x="75" y="238" width="16" height="22" rx="3"/>
    <rect x="115" y="238" width="16" height="22" rx="3"/>
    <rect x="155" y="238" width="16" height="22" rx="3"/>
    <rect x="195" y="238" width="16" height="22" rx="3"/>
    <rect x="235" y="238" width="16" height="22" rx="3"/>
    <rect x="275" y="238" width="16" height="22" rx="3"/>
    <rect x="315" y="238" width="16" height="22" rx="3"/>
    <rect x="355" y="238" width="16" height="22" rx="3"/>
  </g>

  <!-- 3 Sequential Film Stills (Documentary Sequence) -->
  <!-- Frame 24 (Pre-dawn Horizon) -->
  <rect x="35" y="65" width="100" height="155" fill="#2b313b" stroke="#000000" stroke-width="1.5"/>
  <polygon points="35,160 85,150 135,165 135,220 35,220" fill="#1b1e24"/>
  <circle cx="85" cy="115" r="14" fill="#6d7b8f"/>
  <text x="42" y="212" font-family="'Consolas', monospace" font-size="8" fill="#a4b0c2">FR 24</text>

  <!-- Frame 25 (Sunrise Threshold) -->
  <rect x="150" y="65" width="100" height="155" fill="#4d4233" stroke="#000000" stroke-width="1.5"/>
  <polygon points="150,160 200,150 250,165 250,220 150,220" fill="#241e17"/>
  <circle cx="200" cy="115" r="16" fill="#e8a855"/>
  <text x="157" y="212" font-family="'Consolas', monospace" font-size="8" fill="#e8cfad">FR 25</text>

  <!-- Frame 26 (Full Morning Horizon) -->
  <rect x="265" y="65" width="100" height="155" fill="#756149" stroke="#000000" stroke-width="1.5"/>
  <polygon points="265,160 315,150 365,165 365,220 265,220" fill="#36291a"/>
  <circle cx="315" cy="110" r="18" fill="#fff5d9"/>
  <text x="272" y="212" font-family="'Consolas', monospace" font-size="8" fill="#f7e8ce">FR 26</text>

  <!-- Frame Separator Lines -->
  <line x1="142" y1="65" x2="142" y2="220" stroke="#000000" stroke-width="2"/>
  <line x1="257" y1="65" x2="257" y2="220" stroke="#000000" stroke-width="2"/>

  <!-- Archival plate notation -->
  <text x="28" y="274" font-family="'Consolas', 'Menlo', monospace" font-size="8.5" letter-spacing="1" fill="#8d94a0">BETWEEN FRAMES · 35MM FILM STILL SEQUENCE · SALIK RIYAZ</text>
</svg>


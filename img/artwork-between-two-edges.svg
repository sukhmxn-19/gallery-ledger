<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bteLinen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f1e8"/>
      <stop offset="100%" stop-color="#e8e1d2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#ebe4d5"/>
  <rect x="20" y="20" width="360" height="260" fill="url(#bteLinen)" stroke="#cfc5b4" stroke-width="1"/>
  
  <!-- Left Edge: Cut Slate Paper Band with Deckle Edge -->
  <polygon points="60,35 130,35 115,100 135,160 120,210 130,265 60,265" fill="#3b424a" stroke="#252a30" stroke-width="1"/>
  
  <!-- Right Edge: Warm Ochre Paper Band -->
  <polygon points="270,35 340,35 340,265 270,265 285,200 265,150 280,90" fill="#c49348" stroke="#996f2e" stroke-width="1"/>

  <!-- The Interval: Tension Lines in Graphite & Thread -->
  <line x1="125" y1="80" x2="275" y2="80" stroke="#181715" stroke-width="1.5"/>
  <line x1="135" y1="120" x2="265" y2="135" stroke="#787367" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="120" y1="170" x2="280" y2="170" stroke="#181715" stroke-width="1.5"/>
  <line x1="130" y1="210" x2="270" y2="225" stroke="#787367" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Central Balance Monolith -->
  <rect x="185" y="105" width="30" height="90" fill="#ffffff" stroke="#181715" stroke-width="1.5"/>
  <circle cx="200" cy="150" r="4" fill="#9e2a1b"/>

  <!-- Archival plate notation -->
  <text x="28" y="272" font-family="'Consolas', 'Menlo', monospace" font-size="8.5" letter-spacing="1" fill="#787367">BETWEEN TWO EDGES · CUT VELLUM &amp; GRAPHITE · SUKHMANPREET KAUR</text>
</svg>


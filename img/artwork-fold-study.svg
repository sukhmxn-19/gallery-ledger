<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="fsPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="100%" stop-color="#f1ebe1"/>
    </linearGradient>
    <linearGradient id="fsFold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ded5c4"/>
    </linearGradient>
    <linearGradient id="fsFold2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9bfae"/>
      <stop offset="100%" stop-color="#ece5d8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f4efe6"/>
  <rect x="18" y="18" width="364" height="264" fill="url(#fsPaper)" stroke="#d9d0c1" stroke-width="1"/>
  
  <!-- Geometric Paper Facet Folds -->
  <!-- Top left diagonal facet -->
  <polygon points="50,50 200,50 160,160 50,110" fill="url(#fsFold1)" stroke="#b8ad99" stroke-width="0.75"/>
  <!-- Central angular folding plane -->
  <polygon points="200,50 350,90 280,210 160,160" fill="url(#fsFold2)" stroke="#9c917d" stroke-width="1"/>
  <!-- Bottom right grounding facet -->
  <polygon points="160,160 280,210 320,250 110,250" fill="#ded4c3" stroke="#b8ad99" stroke-width="0.75"/>
  <!-- Left tuck plane -->
  <polygon points="50,110 160,160 110,250 50,210" fill="#baa993" stroke="#8f806c" stroke-width="0.75"/>
  
  <!-- Crisp bone folder crease lines -->
  <line x1="50" y1="50" x2="160" y2="160" stroke="#524a3e" stroke-width="1.25"/>
  <line x1="160" y1="160" x2="350" y2="90" stroke="#524a3e" stroke-width="1.25"/>
  <line x1="160" y1="160" x2="280" y2="210" stroke="#524a3e" stroke-width="1.25"/>
  <line x1="160" y1="160" x2="110" y2="250" stroke="#3d372d" stroke-width="1.5"/>

  <!-- Archival plate notation -->
  <text x="28" y="272" font-family="'Consolas', 'Menlo', monospace" font-size="8.5" letter-spacing="1" fill="#787367">FOLD STUDY NO. 01 · VELLUM RELIEF · SUKHMANPREET KAUR</text>
</svg>


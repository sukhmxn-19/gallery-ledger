<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="duskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2a23"/>
      <stop offset="60%" stop-color="#6e4530"/>
      <stop offset="100%" stop-color="#b37418"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#241914"/>
  <rect x="15" y="15" width="370" height="270" fill="url(#duskGrad)" stroke="#543b31" stroke-width="1"/>
  <!-- Interior Room Silhouette at Dusk -->
  <polygon points="40,260 40,80 160,110 160,260" fill="#1d1410"/>
  <polygon points="160,110 360,90 360,260 160,260" fill="#2d1f19"/>
  <!-- Window with Golden Dusk Glow -->
  <rect x="200" y="110" width="80" height="100" fill="#e0973a" fill-opacity="0.85"/>
  <line x1="240" y1="110" x2="240" y2="210" stroke="#1d1410" stroke-width="2"/>
  <line x1="200" y1="160" x2="280" y2="160" stroke="#1d1410" stroke-width="2"/>
  <!-- Lamp Glow on Floor -->
  <polygon points="200,210 280,210 320,260 160,260" fill="#f5be6c" fill-opacity="0.3"/>
  <text x="25" y="275" font-family="'Consolas', monospace" font-size="9" letter-spacing="1" fill="#f5be6c">OIL ON HAND-WOVEN LINEN · ANIKA RAO</text>
</svg>

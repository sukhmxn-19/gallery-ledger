<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#f8f6f0"/>
  <rect x="15" y="15" width="370" height="270" fill="#f2eee5" stroke="#d4ccbd" stroke-width="1"/>
  <!-- Minimalist Linocut Courtyard with Diagonal Rain -->
  <polygon points="60,240 340,240 300,160 100,160" fill="#e2dbcd" stroke="#181715" stroke-width="1.5"/>
  <rect x="160" y="110" width="80" height="50" fill="#181715"/>
  <!-- Diagonal Rain Cuts -->
  <line x1="80" y1="50" x2="60" y2="120" stroke="#9e2a1b" stroke-width="1.5"/>
  <line x1="140" y1="40" x2="110" y2="140" stroke="#181715" stroke-width="1.5"/>
  <line x1="200" y1="45" x2="175" y2="135" stroke="#181715" stroke-width="1.5"/>
  <line x1="260" y1="40" x2="230" y2="140" stroke="#181715" stroke-width="1.5"/>
  <line x1="320" y1="50" x2="295" y2="135" stroke="#9e2a1b" stroke-width="1.5"/>
  <text x="25" y="275" font-family="'Consolas', monospace" font-size="9" letter-spacing="1" fill="#787367">LINOCUT ON MULBERRY PAPER · MEERA KOHLI</text>
</svg>

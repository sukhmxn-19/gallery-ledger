<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="qgKozo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4eee4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#ede7dc"/>
  <rect x="20" y="20" width="360" height="260" fill="url(#qgKozo)" stroke="#dcd4c5" stroke-width="1"/>
  
  <!-- Architectural Modular Grid (6 cols x 4 rows) in Iron Gall Sepia -->
  <g stroke="#7d7465" stroke-width="0.75" fill="none">
    <!-- Horizontal Grid Lines -->
    <line x1="70" y1="65" x2="330" y2="65"/>
    <line x1="70" y1="105" x2="330" y2="105"/>
    <line x1="70" y1="145" x2="330" y2="145"/>
    <line x1="70" y1="185" x2="330" y2="185"/>
    <line x1="70" y1="225" x2="330" y2="225"/>
    <!-- Vertical Grid Lines -->
    <line x1="70" y1="65" x2="70" y2="225"/>
    <line x1="113" y1="65" x2="113" y2="225"/>
    <line x1="156" y1="65" x2="156" y2="225"/>
    <line x1="200" y1="65" x2="200" y2="225"/>
    <line x1="243" y1="65" x2="243" y2="225"/>
    <line x1="286" y1="65" x2="286" y2="225"/>
    <line x1="330" y1="65" x2="330" y2="225"/>
  </g>

  <!-- Rhythmic Solid Infill Cells (Structure vs Negative Space) -->
  <rect x="114" y="66" width="41" height="38" fill="#363027"/>
  <rect x="201" y="66" width="41" height="38" fill="#ded4c3"/>
  <rect x="71" y="106" width="41" height="38" fill="#ded4c3"/>
  <rect x="244" y="106" width="41" height="38" fill="#363027"/>
  <rect x="157" y="146" width="42" height="38" fill="#363027"/>
  <rect x="287" y="146" width="42" height="38" fill="#b0a390"/>
  <rect x="114" y="186" width="41" height="38" fill="#b0a390"/>
  <rect x="201" y="186" width="41" height="38" fill="#363027"/>

  <!-- Precision Corner Registration Crosses -->
  <line x1="65" y1="65" x2="75" y2="65" stroke="#181715" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="70" stroke="#181715" stroke-width="1.5"/>
  <line x1="325" y1="225" x2="335" y2="225" stroke="#181715" stroke-width="1.5"/>
  <line x1="330" y1="220" x2="330" y2="230" stroke="#181715" stroke-width="1.5"/>

  <!-- Archival plate notation -->
  <text x="28" y="272" font-family="'Consolas', 'Menlo', monospace" font-size="8.5" letter-spacing="1" fill="#787367">THE QUIET GRID · IRON GALL INK ON KOZO · SUKHMANPREET KAUR</text>
</svg>


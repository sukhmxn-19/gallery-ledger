<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="rimBirch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eee6d8"/>
      <stop offset="100%" stop-color="#dfd4c1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#ded4c0"/>
  <rect x="20" y="20" width="360" height="260" fill="url(#rimBirch)" stroke="#b8ab94" stroke-width="1.5"/>
  
  <!-- Cradled Board Bevel -->
  <line x1="20" y1="20" x2="380" y2="20" stroke="#fcfaf4" stroke-width="1.5"/>
  <line x1="20" y1="20" x2="20" y2="280" stroke="#fcfaf4" stroke-width="1.5"/>
  
  <!-- Nested Doorways Receding in Memory Perspective -->
  <!-- Outer Chamber Frame -->
  <polygon points="60,40 340,40 340,240 60,240" fill="none" stroke="#2b2620" stroke-width="2"/>
  <polygon points="60,40 100,70 100,210 60,240" fill="#3a332a" fill-opacity="0.85"/>
  <polygon points="340,40 300,70 300,210 340,240" fill="#241f1a"/>
  
  <!-- Middle Chamber Doorway -->
  <polygon points="100,70 300,70 300,210 100,210" fill="#ded3bf" stroke="#3a332a" stroke-width="1.5"/>
  <polygon points="140,95 260,95 260,185 140,185" fill="#1f1b17"/>
  
  <!-- Core Threshold Accent in Casein Terracotta -->
  <line x1="140" y1="185" x2="260" y2="185" stroke="#9e2a1b" stroke-width="2.5"/>
  <circle cx="200" cy="140" r="14" fill="#d49448" fill-opacity="0.85"/>

  <!-- Archival plate notation -->
  <text x="28" y="272" font-family="'Consolas', 'Menlo', monospace" font-size="8.5" letter-spacing="1" fill="#6e6454">ROOMS IN MEMORY · CASEIN &amp; CHARCOAL ON BIRCH · SONAM VERMA</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="saGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2efe9"/>
      <stop offset="100%" stop-color="#dfd9cb"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#ebe4d5"/>
  <rect x="20" y="20" width="360" height="260" fill="url(#saGrad)" stroke="#c7bea9" stroke-width="1"/>
  
  <!-- Layered Muted Sage Architectural Planes -->
  <!-- Deep Background Archway -->
  <path d="M 140,240 L 140,110 Q 200,60 260,110 L 260,240 Z" fill="#38473b" fill-opacity="0.85"/>
  
  <!-- Midground Cantilevered Lintel Plane -->
  <polygon points="80,140 280,100 280,240 80,240" fill="#4d5f51" fill-opacity="0.8" stroke="#2a352c" stroke-width="1"/>
  
  <!-- Foreground Translucent Drafting Film Layer -->
  <polygon points="170,80 330,80 330,220 170,220" fill="#fdfbf7" fill-opacity="0.75" stroke="#b0a896" stroke-width="1"/>
  
  <!-- Architectural Opening Light Cadence -->
  <line x1="140" y1="240" x2="330" y2="240" stroke="#181715" stroke-width="2"/>
  <line x1="170" y1="80" x2="170" y2="220" stroke="#c99a4c" stroke-width="1.5"/>

  <!-- Archival plate notation -->
  <text x="28" y="272" font-family="'Consolas', 'Menlo', monospace" font-size="8.5" letter-spacing="1" fill="#787367">SOFT ARCHITECTURE · GOUACHE &amp; DRAFTING FILM · SONAM VERMA</text>
</svg>


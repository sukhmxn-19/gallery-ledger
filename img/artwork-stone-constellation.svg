<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="scStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3036"/>
      <stop offset="100%" stop-color="#1b1d20"/>
    </linearGradient>
  </defs>
  <!-- Basalt Field Stone Slate -->
  <rect width="400" height="300" fill="#1b1d20"/>
  <rect x="18" y="18" width="364" height="264" fill="url(#scStone)" stroke="#454b54" stroke-width="1"/>

  <!-- Ancient Petroglyph Cup-and-Ring Engravings in Natural Iron Oxide -->
  <circle cx="160" cy="140" r="60" fill="none" stroke="#ba653b" stroke-width="2.5"/>
  <circle cx="160" cy="140" r="42" fill="none" stroke="#ba653b" stroke-width="1.75"/>
  <circle cx="160" cy="140" r="24" fill="none" stroke="#ba653b" stroke-width="1.5"/>
  <circle cx="160" cy="140" r="8" fill="#ba653b"/>
  <!-- Megalith Alignment Axis -->
  <line x1="60" y1="210" x2="330" y2="90" stroke="#ba653b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Precision Celestial Coordinate Overlay in Archival Gold / Ivory -->
  <!-- Coordinate Arc -->
  <path d="M 120,40 Q 280,70 330,240" fill="none" stroke="#e8dcc8" stroke-width="1" stroke-opacity="0.8"/>
  <circle cx="280" cy="110" r="5" fill="#fcf8f0"/>
  <circle cx="210" cy="75" r="3.5" fill="#fcf8f0"/>
  <circle cx="310" cy="180" r="4" fill="#fcf8f0"/>
  <circle cx="240" cy="190" r="3" fill="#fcf8f0"/>
  <circle cx="120" cy="90" r="3" fill="#fcf8f0"/>
  
  <!-- Constellation Linking Vectors -->
  <line x1="210" y1="75" x2="280" y2="110" stroke="#e8dcc8" stroke-width="0.75" stroke-opacity="0.7"/>
  <line x1="280" y1="110" x2="310" y2="180" stroke="#e8dcc8" stroke-width="0.75" stroke-opacity="0.7"/>
  <line x1="310" y1="180" x2="240" y2="190" stroke="#e8dcc8" stroke-width="0.75" stroke-opacity="0.7"/>
  <line x1="240" y1="190" x2="160" y2="140" stroke="#e8dcc8" stroke-width="0.75" stroke-opacity="0.7"/>

  <!-- Field Rubbing Coordinate Grid Ticks -->
  <line x1="30" y1="50" x2="45" y2="50" stroke="#717a87" stroke-width="1"/>
  <line x1="30" y1="50" x2="30" y2="65" stroke="#717a87" stroke-width="1"/>
  <text x="50" y="55" font-family="'Consolas', monospace" font-size="8" fill="#8d97a5">GRID 34°N · STONE LOC. IV</text>

  <!-- Archival plate notation -->
  <text x="28" y="272" font-family="'Consolas', 'Menlo', monospace" font-size="8.5" letter-spacing="1" fill="#8d97a5">STONE / CONSTELLATION · FIELD STONE RUBBING &amp; CHART · SALIK RIYAZ</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="esGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a221b"/>
      <stop offset="100%" stop-color="#191512"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a3b14"/>
      <stop offset="50%" stop-color="#b3541e"/>
      <stop offset="100%" stop-color="#6e2d0d"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#esGrad)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#544437" stroke-width="1"/>
  
  <!-- Raw Earth & Textured Ochre Ground -->
  <polygon points="40,360 40,240 260,200 560,280 560,360" fill="#3d2f25" stroke="#6e5746" stroke-width="1"/>
  
  <!-- Monumental Steel Arc (Weathered Corten Steel Silhouette) -->
  <path d="M 120,340 C 130,120 380,80 480,240 C 440,240 350,140 200,340 Z" fill="url(#rustGrad)" stroke="#181715" stroke-width="2"/>
  
  <!-- Counterbalance Limestone Sphere / Form -->
  <circle cx="360" cy="180" r="65" fill="#cfc2ad" stroke="#3d2f25" stroke-width="2"/>
  <ellipse cx="340" cy="165" rx="45" ry="40" fill="#e8ded0" fill-opacity="0.6"/>
  <path d="M 330,140 Q 360,180 390,220" stroke="#787367" stroke-width="1.5" fill="none"/>

  <!-- Raw Steel Pylon -->
  <polygon points="180,360 210,140 235,145 205,360" fill="#181715" stroke="#8a3b14" stroke-width="1.5"/>

  <!-- Archival Typography / Curatorial Badge -->
  <rect x="45" y="45" width="180" height="26" fill="#181715" stroke="#8a3b14" stroke-width="0.5"/>
  <text x="55" y="62" font-family="'Consolas', 'Menlo', monospace" font-size="11" letter-spacing="1.5" fill="#f8f6f0">SERIES 18 // MATERIALITY</text>
  <text x="45" y="325" font-family="'Playfair Display', Georgia, serif" font-size="22" font-style="italic" fill="#ffffff">Forms of Earth &amp; Steel</text>
  <text x="555" y="365" font-family="'Consolas', 'Menlo', monospace" font-size="10" letter-spacing="1" fill="#a0856d" text-anchor="end">CORTEN STEEL, RAW LIMESTONE &amp; TEXTURED PIGMENTS</text>
</svg>


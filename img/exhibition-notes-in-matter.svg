<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="nimPaper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5efe4"/>
      <stop offset="100%" stop-color="#e8dfce"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#24211d"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#4d463d" stroke-width="1"/>
  
  <!-- Archival Specimen Plate -->
  <rect x="80" y="70" width="440" height="250" fill="url(#nimPaper)" stroke="#c2b6a0" stroke-width="1.5"/>
  <rect x="95" y="85" width="410" height="220" fill="none" stroke="#d5cabb" stroke-width="0.75" stroke-dasharray="4,4"/>
  
  <!-- Tactile Material Impressions & Rubbing Striations -->
  <polygon points="120,110 240,110 210,260 140,260" fill="#383228" stroke="#1f1b15" stroke-width="1.5"/>
  <polygon points="260,130 380,130 360,240 280,240" fill="#a89b87" stroke="#756956" stroke-width="1.5"/>
  <circle cx="430" cy="180" r="45" fill="none" stroke="#9e2a1b" stroke-width="2"/>
  <line x1="430" y1="120" x2="430" y2="240" stroke="#9e2a1b" stroke-width="0.75"/>
  <line x1="370" y1="180" x2="490" y2="180" stroke="#9e2a1b" stroke-width="0.75"/>
  
  <!-- Field Notebook Measurement Ticks -->
  <line x1="100" y1="285" x2="500" y2="285" stroke="#787367" stroke-width="1"/>
  <line x1="100" y1="280" x2="100" y2="290" stroke="#787367" stroke-width="1"/>
  <line x1="200" y1="282" x2="200" y2="288" stroke="#787367" stroke-width="1"/>
  <line x1="300" y1="280" x2="300" y2="290" stroke="#787367" stroke-width="1"/>
  <line x1="400" y1="282" x2="400" y2="288" stroke="#787367" stroke-width="1"/>
  <line x1="500" y1="280" x2="500" y2="290" stroke="#787367" stroke-width="1"/>

  <!-- Archival Typography -->
  <rect x="45" y="45" width="200" height="26" fill="#181715" stroke="#787367" stroke-width="0.5"/>
  <text x="55" y="62" font-family="'Consolas', 'Menlo', monospace" font-size="11" letter-spacing="1.5" fill="#f8f6f0">ARCHIVAL RECORD · CLOSED</text>
  <text x="45" y="350" font-family="'Playfair Display', Georgia, serif" font-size="24" font-style="italic" fill="#ffffff">Notes in Matter</text>
  <text x="555" y="350" font-family="'Consolas', 'Menlo', monospace" font-size="10" letter-spacing="1" fill="#c2b6a0" text-anchor="end">FORM · TEXTURE · THE MATERIAL RECORD</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="pmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b241e"/>
      <stop offset="100%" stop-color="#0f1612"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#pmGrad)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#2c3d31" stroke-width="1"/>

  <!-- Organic Relief Printmaking Cut / Linocut Textures -->
  <path d="M 60,320 Q 180,80 320,160 T 540,240" fill="none" stroke="#386641" stroke-width="4"/>
  <path d="M 80,340 Q 200,100 340,180 T 560,260" fill="none" stroke="#386641" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 40,300 Q 160,60 300,140 T 520,220" fill="none" stroke="#386641" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Botanical / Organic Geometric Leaves in Linocut -->
  <g stroke="#e2ded4" stroke-width="1.5" fill="none">
    <!-- Leaf 1 -->
    <path d="M 180,240 C 140,180 180,120 240,110 C 260,160 230,220 180,240 Z" fill="#243328"/>
    <line x1="180" y1="240" x2="240" y2="110"/>
    <line x1="195" y1="205" x2="175" y2="185"/>
    <line x1="210" y1="175" x2="190" y2="155"/>
    <line x1="225" y1="145" x2="205" y2="125"/>
    <line x1="200" y1="215" x2="225" y2="205"/>
    <line x1="215" y1="185" x2="240" y2="175"/>
    <!-- Leaf 2 -->
    <path d="M 280,260 C 260,200 310,140 370,140 C 380,195 340,245 280,260 Z" fill="#2c3f32"/>
    <line x1="280" y1="260" x2="370" y2="140"/>
    <line x1="300" y1="230" x2="280" y2="210"/>
    <line x1="320" y1="200" x2="300" y2="180"/>
    <line x1="340" y1="170" x2="320" y2="150"/>
  </g>

  <!-- Deep Ink Stamp Geometric Disc -->
  <circle cx="430" cy="180" r="70" fill="#b37418" fill-opacity="0.2" stroke="#b37418" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="430" cy="180" r="50" fill="#9e2a1b" fill-opacity="0.8"/>
  <line x1="370" y1="180" x2="490" y2="180" stroke="#f8f6f0" stroke-width="2"/>

  <!-- Archival Typography / Curatorial Badge -->
  <rect x="45" y="45" width="220" height="26" fill="#181715" stroke="#386641" stroke-width="0.5"/>
  <text x="55" y="62" font-family="'Consolas', 'Menlo', monospace" font-size="11" letter-spacing="1.5" fill="#f8f6f0">SERIES 19 // CONTEMPORARY GRAPHICS</text>
  <text x="45" y="325" font-family="'Playfair Display', Georgia, serif" font-size="22" font-style="italic" fill="#ffffff">New Printmakers</text>
  <text x="555" y="365" font-family="'Consolas', 'Menlo', monospace" font-size="10" letter-spacing="1" fill="#7da687" text-anchor="end">WOODCUT RELIEF, AQUATINT &amp; FINE ETCHING</text>
</svg>


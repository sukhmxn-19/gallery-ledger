<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="rflSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a251e"/>
      <stop offset="100%" stop-color="#181512"/>
    </linearGradient>
    <linearGradient id="rflAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedd2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8af55" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#rflSky)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#4a4237" stroke-width="1"/>
  
  <!-- Receding Interior Doorway Thresholds -->
  <polygon points="90,340 160,80 340,80 300,340" fill="#383025" stroke="#756754" stroke-width="1"/>
  <polygon points="160,80 230,120 310,120 340,80" fill="#4d4233"/>
  <polygon points="230,340 230,120 310,120 310,340" fill="#241e17" stroke="#87755f" stroke-width="1.5"/>
  
  <!-- Diagonal Sunlight Cast Across Floors -->
  <polygon points="230,120 480,340 310,340" fill="url(#rflAmber)"/>
  <line x1="230" y1="120" x2="480" y2="340" stroke="#fce4b8" stroke-width="1.5" stroke-opacity="0.75"/>
  
  <!-- Subtle Wall Shadow Slats -->
  <line x1="90" y1="200" x2="160" y2="170" stroke="#756754" stroke-width="1.5"/>
  <line x1="95" y1="240" x2="165" y2="210" stroke="#756754" stroke-width="1.5"/>
  <line x1="100" y1="280" x2="170" y2="250" stroke="#756754" stroke-width="1.5"/>

  <!-- Archival Typography -->
  <rect x="45" y="45" width="200" height="26" fill="#181512" stroke="#756754" stroke-width="0.5"/>
  <text x="55" y="62" font-family="'Consolas', 'Menlo', monospace" font-size="11" letter-spacing="1.5" fill="#f8f6f0">UPCOMING EXHIBITION</text>
  <text x="45" y="325" font-family="'Playfair Display', Georgia, serif" font-size="24" font-style="italic" fill="#ffffff">Rooms for Light</text>
  <text x="555" y="365" font-family="'Consolas', 'Menlo', monospace" font-size="10" letter-spacing="1" fill="#c2ab8a" text-anchor="end">ARCHITECTURE · ILLUMINATION · MEMORY</text>
</svg>


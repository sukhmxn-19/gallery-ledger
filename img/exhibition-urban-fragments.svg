<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="ufGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22201d"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#ufGrad)"/>
  <!-- Archival Framing Inset -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#4a4740" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="350" fill="none" stroke="#33302b" stroke-width="0.5"/>
  
  <!-- Architectural Geometry / Woodcut Perspective -->
  <polygon points="60,340 180,80 260,120 200,340" fill="#38342f" stroke="#787367" stroke-width="1"/>
  <polygon points="200,340 260,120 380,60 350,340" fill="#4d4740" stroke="#a09786" stroke-width="1.5"/>
  <polygon points="350,340 380,60 480,110 440,340" fill="#2b2824" stroke="#787367" stroke-width="1"/>
  <polygon points="440,340 480,110 540,160 510,340" fill="#1d1b18" stroke="#524d45" stroke-width="1"/>
  
  <!-- Architectural Rhythmic Windows & Facade Cuts -->
  <line x1="220" y1="160" x2="330" y2="120" stroke="#f8f6f0" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="225" y1="190" x2="335" y2="150" stroke="#f8f6f0" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="230" y1="220" x2="340" y2="180" stroke="#f8f6f0" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="235" y1="250" x2="345" y2="210" stroke="#f8f6f0" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="240" y1="280" x2="350" y2="240" stroke="#f8f6f0" stroke-width="1" stroke-opacity="0.8"/>
  
  <!-- Monolithic Bridge Arch -->
  <path d="M 60,340 Q 250,220 540,340" fill="none" stroke="#9e2a1b" stroke-width="3"/>
  <line x1="60" y1="340" x2="540" y2="340" stroke="#d4ccbd" stroke-width="1.5"/>

  <!-- Archival Typography / Curatorial Badge -->
  <rect x="45" y="45" width="180" height="26" fill="#181715" stroke="#787367" stroke-width="0.5"/>
  <text x="55" y="62" font-family="'Consolas', 'Menlo', monospace" font-size="11" letter-spacing="1.5" fill="#f8f6f0">SERIES 17 // ARCHITECTURE</text>
  <text x="45" y="325" font-family="'Playfair Display', Georgia, serif" font-size="22" font-style="italic" fill="#ffffff">Urban Fragments</text>
  <text x="555" y="365" font-family="'Consolas', 'Menlo', monospace" font-size="10" letter-spacing="1" fill="#787367" text-anchor="end">MONOCHROME RELIEF &amp; ARCHITECTURAL ETCHING</text>
</svg>

